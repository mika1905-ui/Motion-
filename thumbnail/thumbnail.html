<style>
  @font-face { font-family: "Anton"; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  #thumb { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #cfd6dc; }
  #thumb > * { position: absolute; }

  /* ---------- background: sky, skyline, plaza ---------- */
  .sky { inset: 0 0 auto 0; height: 250px;
         background: linear-gradient(180deg, #1f7fe0 0%, #58aaf2 45%, #cfe9fb 100%); }
  .cloud { background: #fff; border-radius: 50%; filter: blur(9px); opacity: .95; }
  .skyline { left: 0; top: 34px; width: 1280px; height: 218px; filter: blur(.6px) saturate(1.3) contrast(1.15); }
  .plaza { left: 0; right: 0; top: 246px; bottom: 0;
           background:
             repeating-linear-gradient(90deg, rgba(0, 0, 0, .06) 0 2px, transparent 2px 160px),
             linear-gradient(180deg, #b9bcc0 0%, #dcdcda 30%, #c9c7c2 100%); }
  .sun { left: 0; top: 0; width: 1280px; height: 720px; mix-blend-mode: soft-light;
         background: radial-gradient(ellipse 700px 420px at 50% 22%, rgba(255, 244, 200, .45), transparent 70%); }

  /* ---------- podium + car ---------- */
  .podium { left: 222px; top: 286px; width: 836px; height: 170px; }
  .car, .car-reflect { left: 312px; width: 656px; }
  .car { top: 132px; filter: saturate(1.35) contrast(1.12) brightness(1.04) drop-shadow(0 10px 8px rgba(0, 0, 0, .55)); }
  .car-reflect { top: 338px; transform: scaleY(-1); opacity: .28; filter: blur(2px) saturate(1.2);
                 -webkit-mask-image: linear-gradient(0deg, #000 0%, transparent 42%);
                         mask-image: linear-gradient(0deg, #000 0%, transparent 42%); }

  /* ---------- presenters ---------- */
  .person { top: 6px; height: 730px; filter: drop-shadow(0 0 18px rgba(0, 0, 0, .45)) saturate(1.1); }
  .p-left { left: -132px; }
  .p-right { left: 850px; }

  /* ---------- text bars ---------- */
  .bars { left: 0; width: 1280px; top: 424px; display: flex; flex-direction: column; align-items: center;
          transform: rotate(-2deg); font-family: "Anton", "Inter", sans-serif; text-transform: uppercase; }
  .bar { white-space: nowrap; line-height: 1; transform: skewX(-7deg); }
  .bar.yellow { font-size: 82px; padding: 8px 30px 12px; color: #111;
                background: linear-gradient(180deg, #ffe033 0%, #ffc400 100%);
                box-shadow: inset 0 0 0 3px rgba(120, 80, 0, .35), 0 8px 18px rgba(0, 0, 0, .5); }
  .bar.black { font-size: 92px; padding: 8px 34px 14px; margin-top: 6px; color: #fff;
               background: linear-gradient(180deg, #1b1b1b 0%, #000 100%);
               box-shadow: 0 10px 22px rgba(0, 0, 0, .55); letter-spacing: .5px; }

  .grade { inset: 0; pointer-events: none;
           background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .32) 100%); }
</style>
