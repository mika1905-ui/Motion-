<style>
  :root { --ion: #39d6ff; --ion-soft: rgba(57,214,255,.55); }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: #fff;
         -webkit-font-smoothing: antialiased; }
  /* 9:16 stage, always fully visible */
  #stage { position: relative; width: min(100vw, 56.25dvh); height: min(100dvh, 177.78vw);
           container-type: size; overflow: hidden; background: #020304; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 75% at 50% 55%, transparent 45%, rgba(0,0,0,.75) 100%),
                linear-gradient(to bottom, rgba(0,0,0,.55), transparent 22%, transparent 70%, rgba(0,0,0,.7)); }
  .grain { position: absolute; inset: -50%; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.6s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }
  .glass { background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
           border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .word { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .06em; }
  .word > span { display: inline-block; will-change: transform; }
  .chrome-text { background: linear-gradient(180deg, #fff 0%, #dfe6ee 40%, #8c97a3 55%, #f4f7fb 75%, #b7c1cc 100%);
                 -webkit-background-clip: text; background-clip: text; color: transparent; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, #e9fbff, rgba(120,220,255,.4) 40%, transparent 75%);
           opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  #hint { transition: opacity .6s; }
  .ui-hidden #hint, .ui-hidden #replay { opacity: 0 !important; pointer-events: none; }

<body>

      <div class="mt-[1.6cqw] flex items-end justify-between">
        <div class="text-[7.2cqw] font-extralight leading-[1.02] tracking-tight">Form<br/><span class="text-white/50">folgt Gefühl.</span></div>

    <h1 class="mt-[2.5cqw] font-extralight leading-[0.92] tracking-[-0.03em] text-[15cqw]">
      <span class="word"><span class="chrome-text">The</span></span>

    <div id="sub" class="mt-[3cqw] text-[3.1cqw] font-light tracking-[0.35em] text-white/70 opacity-0">AURÉON LM-01 · HYPERCAR</div>

  <div id="stats" class="absolute inset-x-[6cqw] bottom-[9cqw] pointer-events-none">

        <div class="mono text-[2.1cqw] tracking-[0.25em] text-white/50">0–100 KM/H</div>
        <div class="mt-[1.4cqw] text-[8cqw] font-extralight leading-none"><span id="s1">0.0</span><span class="text-[3.4cqw] text-white/60"> s</span></div>
      </div>
      <div class="stat text-center opacity-0">
        <div class="mono text-[2.1cqw] tracking-[0.25em] text-white/50">LEISTUNG</div>
        <div class="mt-[1.4cqw] text-[8cqw] font-extralight leading-none"><span id="s2">0</span><span class="text-[3.4cqw] text-white/60"> PS</span></div>
      </div>

        <div class="mono text-[2.1cqw] tracking-[0.25em] text-white/50">V<sub>MAX</sub></div>
        <div class="mt-[1.4cqw] text-[8cqw] font-extralight leading-none"><span id="s3">0</span><span class="text-[3.4cqw] text-white/60"> km/h</span></div>
      </div>

    <div id="tag" class="mt-[3.5cqw] flex items-center justify-center gap-[2cqw] opacity-0">
      <span class="h-px w-[8cqw] bg-white/30"></span>
      <span class="mono text-[2.2cqw] tracking-[0.45em] text-white/60">BORN FROM LIQUID METAL</span>
      <span class="h-px w-[8cqw] bg-white/30"></span>
    </div>
  </div>

  <!-- ===== Controls (hide with H for a clean recording) ===== -->
  <div id="hint" class="absolute top-[17cqw] inset-x-0 text-center mono text-[2.2cqw] text-white/45 tracking-widest">
    SPACE pause · R replay · SCROLL scrub · H hide

  <button id="replay" class="absolute right-[5cqw] top-[16cqw] mono text-[2.4cqw] tracking-widest px-[3cqw] py-[1.5cqw] rounded-full glass text-white/80 opacity-0 pointer-events-none transition-opacity">↻ REPLAY</button>
  <div id="loading" class="absolute inset-0 grid place-items-center mono text-[2.6cqw] tracking-[0.5em] text-white/40">LOADING</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020304);
const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.1, 120);

/* ---------- Studio environment (Apple-style softboxes + cyber accents) ---------- */
function buildEnvironment() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(44, 22, 44),
    new THREE.MeshBasicMaterial({ color: 0x020304, side: THREE.BackSide })));
  const panel = (w, h, col, k, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); s.add(m);
  };
  panel(16, 2.4, 0xffffff, 5, [0, 9.5, 0], [Math.PI / 2, 0, 0]);       // main softbox
  panel(16, 0.35, 0xffffff, 9, [0, 9.2, -3.6], [Math.PI / 2, 0, 0]);    // strip lights
  panel(16, 0.35, 0xffffff, 9, [0, 9.2, 3.6], [Math.PI / 2, 0, 0]);
  panel(0.5, 14, 0x39d6ff, 8, [-15, 4, -2], [0, Math.PI / 2, 0]);      // ion cyan
  panel(0.5, 14, 0xff2f74, 5, [15, 4, 3], [0, -Math.PI / 2, 0]);       // magenta
  panel(26, 0.35, 0xffffff, 4, [0, 1.6, -17], [0, 0, 0]);              // horizon lines
  panel(26, 0.25, 0xbfe9ff, 3, [0, 0.9, 17], [0, Math.PI, 0]);
  panel(7, 7, 0xffffff, 2.2, [11, 7, -11], [0, -Math.PI / 4, 0]);
  panel(5, 9, 0x8fdfff, 1.2, [-11, 5, 11], [0, (3 * Math.PI) / 4, 0]);
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.025).texture;
  pm.dispose();
  return tex;
}
scene.environment = buildEnvironment();

/* ---------- Floor: real mirror + dark glossy overlay with grid & pulse ---------- */
const reflector = new Reflector(new THREE.PlaneGeometry(80, 80), {
  clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0x8a9099,
});
reflector.rotation.x = -Math.PI / 2;
scene.add(reflector);

const floorU = { uGrid: { value: 0 }, uPulse: { value: 0 }, uShadow: { value: 0 }, uTime: { value: 0 } };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShaderMaterial({
  uniforms: floorU, transparent: true, depthWrite: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `
    varying vec3 vW; uniform float uGrid, uPulse, uShadow, uTime;
    void main(){
      float d = length(vW.xz);
      float a = 0.80 + 0.20*smoothstep(4.0, 16.0, d);
      vec2 c = vW.xz*0.5;
      vec2 g = abs(fract(c - 0.5) - 0.5) / fwidth(c);
      float line = 1.0 - min(min(g.x, g.y), 1.0);
      float fade = 1.0 - smoothstep(1.5, 11.0, d);
      vec3 col = vec3(0.010, 0.012, 0.016);
      col += vec3(0.6, 0.75, 0.9) * 0.05 * exp(-d*d*0.06);                // spotlight pool
      col += vec3(0.15, 0.75, 1.0) * line * fade * 0.22 * uGrid;          // grid
      float r = uPulse * 16.0;
      float ring = exp(-pow((d - r) * 2.6, 2.0)) * (1.0 - uPulse);
      col += vec3(0.25, 0.85, 1.0) * ring * 1.6;                           // shock ring
      float sh = 1.0 - smoothstep(0.35, 1.05, length(vW.xz * vec2(0.40, 0.92)));
      col *= 1.0 - 0.85 * sh * uShadow;
      gl_FragColor = vec4(col, max(a, 0.97 * sh * uShadow));
    }`,
}));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.002;
scene.add(floor);

/* =====================================================================
   Procedural hypercar body (lofted super-smooth surface)
   ===================================================================== */
function spline(pts) {
  const n = pts.length;
  return (x) => {
    if (x <= pts[0][0]) return pts[0][1];
    if (x >= pts[n - 1][0]) return pts[n - 1][1];
    let i = 0; while (x > pts[i + 1][0]) i++;
    const t = (x - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
    const p0 = pts[Math.max(i - 1, 0)][1], p1 = pts[i][1], p2 = pts[i + 1][1], p3 = pts[Math.min(i + 2, n - 1)][1];
    return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  };
}
// x: rear (-) -> front (+), metres
const TOP = spline([[-2.36, 0.78], [-2.26, 0.90], [-1.95, 0.93], [-1.5, 0.95], [-0.95, 1.01], [-0.35, 1.08],
                    [0.15, 1.05], [0.6, 0.90], [1.0, 0.80], [1.55, 0.76], [2.05, 0.63], [2.36, 0.45]]);
const SHO = spline([[-2.36, 0.70], [-2.1, 0.86], [-1.5, 0.89], [-0.9, 0.84], [0.0, 0.80], [0.7, 0.80],
                    [1.4, 0.73], [2.0, 0.58], [2.36, 0.42]]);
const WID = spline([[-2.36, 0.80], [-2.15, 0.96], [-1.5, 1.03], [-0.8, 0.93], [0.0, 0.91], [0.8, 0.95],
                    [1.42, 1.0], [2.0, 0.92], [2.36, 0.72]]);
const BOT0 = spline([[-2.36, 0.40], [-2.2, 0.24], [-1.9, 0.17], [1.9, 0.17], [2.2, 0.21], [2.36, 0.30]]);
const WHEEL_X = [1.42, -1.46], WHEEL_R = 0.37, WHEEL_Z = 0.84, ARCH = 0.47;
function BOT(x) {
  let b = BOT0(x);
  for (const cx of WHEEL_X) {
    const d = x - cx;
    if (Math.abs(d) < ARCH) b = Math.max(b, Math.min(WHEEL_R + Math.sqrt(ARCH * ARCH - d * d), 0.62));
  }
  return b;
}

function sectionCurve(x) {
  const b = BOT(x), s = Math.max(SHO(x), b + 0.08), t = Math.max(TOP(x), s + 0.03), W = WID(x);
  const Wr = Math.min(W * 0.66, 0.66), h = s - b, g = t - s;
  const R = [
    [W * 0.78, b], [W * 0.97, b + 0.08 * h + 0.01], [W, b + 0.5 * h], [W * 0.985, b + 0.86 * h],
    [W * 0.93, s], [Wr + (W * 0.93 - Wr) * 0.4, s + 0.3 * g], [Wr * 0.93, s + 0.78 * g], [Wr * 0.52, t - 0.004],
  ];
  const pts = [new THREE.Vector3(0, b, 0)];
  R.forEach(([z, y]) => pts.push(new THREE.Vector3(z, y, 0)));
  pts.push(new THREE.Vector3(0, t, 0));
  for (let i = R.length - 1; i >= 0; i--) pts.push(new THREE.Vector3(-R[i][0], R[i][1], 0));
  const c = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  c.arcLengthDivisions = 400;
  return { curve: c, cy: (b + t) * 0.5 };
}

function buildBody() {
  const SEG = 128, RINGS = 230, X0 = -2.36, X1 = 2.36;
  const rings = [];
  const caps = [[0.034, 0.82], [0.052, 0.52], [0.06, 0.04]];
  for (let k = caps.length - 1; k >= 0; k--) rings.push({ x: X0, dx: -caps[k][0], k: caps[k][1] });
  for (let i = 0; i < RINGS; i++) rings.push({ x: X0 + (X1 - X0) * (i / (RINGS - 1)), dx: 0, k: 1 });
  for (let k = 0; k < caps.length; k++) rings.push({ x: X1, dx: caps[k][0], k: caps[k][1] });

  const pos = [], mask = [];
  for (const r of rings) {
    const { curve, cy } = sectionCurve(r.x);
    const P = curve.getSpacedPoints(SEG);
    for (let j = 0; j < SEG; j++) {
      const z = P[j].x * r.k, y = cy + (P[j].y - cy) * r.k, x = r.x + r.dx;
      pos.push(x, y, z);
      // material masks — signed linear fields, sharpened in the shader
      const sh = SHO(x), az = Math.abs(z);
      const glass = Math.min(y - (sh + 0.035), x + 1.62, 0.95 - x);
      const head = Math.min(0.018 - Math.abs(y - (sh - 0.04)), x - 1.95, az - 0.3);
      const tail = Math.min(0.026 - Math.abs(y - (sh - 0.075)), -2.2 - x);
      const lower = Math.max((BOT(x) + 0.085) - y, Math.min(x - 2.2, sh - 0.13 - y));
      mask.push(glass, head, tail, lower);
    }
  }
  const idx = [];
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < SEG; j++) {
      const a = i * SEG + j, b = (i + 1) * SEG + j, c = i * SEG + ((j + 1) % SEG), d = (i + 1) * SEG + ((j + 1) % SEG);
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aMask', new THREE.Float32BufferAttribute(mask, 4));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------- Materials ---------- */
const reveal = new THREE.Plane(new THREE.Vector3(-1, 0, 0), -10); // renders x <= constant
const fx = { uLights: { value: 0 }, uReveal: { value: -10 }, uScan: { value: 0 } };

const paint = new THREE.MeshPhysicalMaterial({
  color: 0xc3cad3, metalness: 0.9, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.03,
  envMapIntensity: 1.25, side: THREE.DoubleSide, clippingPlanes: [reveal],
});
paint.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, fx);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec4 aMask; varying vec4 vMask; varying vec3 vWPos;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvMask = aMask; vWPos = (modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec4 vMask; varying vec3 vWPos; uniform float uLights, uReveal, uScan;')
    .replace('#include <color_fragment>', `#include <color_fragment>
      float gGlass = smoothstep(-0.006, 0.006, vMask.x);
      float gHead  = smoothstep(-0.003, 0.003, vMask.y);
      float gTail  = smoothstep(-0.003, 0.003, vMask.z);
      float gLow   = smoothstep(-0.008, 0.008, vMask.w);
      float gDark  = max(gGlass, gLow);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.012, 0.014, 0.018), gDark);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.85), gHead);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.25, 0.0, 0.01), gTail);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.03, gGlass);
      roughnessFactor = mix(roughnessFactor, 0.45, gLow);`)
    .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
      metalnessFactor = mix(metalnessFactor, 0.1, max(gDark, max(gHead, gTail)));`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += vec3(0.75, 0.93, 1.0) * gHead * uLights * 3.2;
      totalEmissiveRadiance += vec3(1.0, 0.04, 0.07) * gTail * uLights * 6.0;
      float e = uReveal - vWPos.x;
      totalEmissiveRadiance += vec3(0.25, 0.85, 1.0) * exp(-max(e, 0.0) * 16.0) * uScan * 4.0;`);
};
paint.customProgramCacheKey = () => 'aureon-paint';

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xf0f4f8, metalness: 1, roughness: 0.05, envMapIntensity: 1.6, clearcoat: 0.6,
});
const rubber = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.75, metalness: 0, clippingPlanes: [reveal] });
const rimMat = new THREE.MeshStandardMaterial({ color: 0x2a2d31, roughness: 0.25, metalness: 1, envMapIntensity: 1.3, clippingPlanes: [reveal] });
const caliperMat = new THREE.MeshStandardMaterial({ color: 0x39d6ff, emissive: 0x0a5a70, roughness: 0.35, metalness: 0.2, clippingPlanes: [reveal] });
const paintPlain = paint.clone(); // non-masked parts (wing)
paintPlain.onBeforeCompile = () => {}; paintPlain.customProgramCacheKey = () => 'plain';
paintPlain.clippingPlanes = [reveal];

/* ---------- Car assembly ---------- */
const car = new THREE.Group();
scene.add(car);
const body = new THREE.Mesh(buildBody(), paint);
car.add(body);

// rear wing blade
const wing = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.025, 1.78), paintPlain);
wing.position.set(-2.12, TOP(-2.12) + 0.13, 0); wing.rotation.z = 0.08; car.add(wing);
for (const z of [-0.45, 0.45]) {
  const st = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.13, 0.02), rimMat);
  st.position.set(-2.1, TOP(-2.1) + 0.06, z); car.add(st);
}

const tires = [];
function makeWheel(x, side) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.27, 64, 1).rotateX(Math.PI / 2), rubber);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.255, 0.275, 64).rotateX(Math.PI / 2), rimMat);
  g.add(tire, rim);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.23, 0.02), chrome.clone());
    sp.material.clippingPlanes = [reveal];
    sp.position.set(Math.sin(a) * 0.12, Math.cos(a) * 0.12, 0.14); sp.rotation.z = -a; g.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.03, 24).rotateX(Math.PI / 2), caliperMat);
  hub.position.z = 0.15; g.add(hub);
  const cal = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.08, 0.06), caliperMat);
  cal.position.set(0.13, 0.12, 0.09); cal.rotation.z = -0.6; g.add(cal);
  g.position.set(x, WHEEL_R, side * WHEEL_Z);
  if (side < 0) g.rotation.y = Math.PI;
  car.add(g);
  tires.push(tire);
}
for (const x of WHEEL_X) { makeWheel(x, 1); makeWheel(x, -1); }
car.updateMatrixWorld(true);

/* ---------- Scanner light sheet ---------- */
const scan = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.7), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uI: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uI;
    void main(){ vec2 p = abs(vUv - 0.5) * 2.0;
      float a = (1.0 - smoothstep(0.55, 1.0, p.x)) * (1.0 - smoothstep(0.6, 1.0, p.y));
      gl_FragColor = vec4(vec3(0.25, 0.8, 1.0) * a * uI * 0.35, 1.0); }`,
}));
scan.rotation.y = Math.PI / 2; scan.position.y = 0.75;
scene.add(scan);

/* =====================================================================
   Liquid metal: metaballs (marching cubes) + chrome droplets
   ===================================================================== */
const MC_SCALE = 3.0, MC_POS = new THREE.Vector3(0, 1.2, 0);
const mc = new MarchingCubes(56, chrome, false, false, 90000);
mc.position.copy(MC_POS); mc.scale.setScalar(MC_SCALE); mc.isolation = 80; mc.frustumCulled = false;
scene.add(mc);

const rnd = (() => { let s = 1337; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const BLOBS = Array.from({ length: 13 }, (_, i) => ({
  base: new THREE.Vector3((rnd() - 0.5) * 4.2, 0.7 + rnd() * 1.7, (rnd() - 0.5) * 1.8),
  line: new THREE.Vector3(-2.0 + (4.0 * i) / 12, 0.62 + Math.sin(i * 1.7) * 0.12, Math.cos(i * 2.3) * 0.35),
  f: [0.35 + rnd() * 0.4, 0.3 + rnd() * 0.4, 0.3 + rnd() * 0.4],
  ph: [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28],
  amp: 0.35 + rnd() * 0.45,
  s: 0.45 + rnd() * 0.5,
}));
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

function blobPos(i, t, out) {
  const b = BLOBS[i];
  out.set(
    b.base.x + Math.sin(t * b.f[0] + b.ph[0]) * b.amp,
    b.base.y + Math.sin(t * b.f[1] + b.ph[1]) * b.amp * 0.55,
    b.base.z + Math.sin(t * b.f[2] + b.ph[2]) * b.amp * 0.7);
  return out.lerp(b.line, sstep(2.4, 5.6, t) * 0.75);
}
function blobStrength(i, t) {
  const b = BLOBS[i];
  return b.s * sstep(0.0, 1.4, t) * (0.85 + 0.15 * Math.sin(t * 2.2 + i)) * (1 - sstep(5.0, 7.0, t));
}
const blobRadius = (i, t) => Math.sqrt(Math.max(blobStrength(i, t), 0) / 92) * 2 * MC_SCALE;

const _v = new THREE.Vector3();
function updateMetaballs(t) {
  const alive = t < 7.05;
  mc.visible = alive;
  if (!alive) return;
  mc.reset();
  for (let i = 0; i < BLOBS.length; i++) {
    const s = blobStrength(i, t);
    if (s < 0.004) continue;
    blobPos(i, t, _v).sub(MC_POS).divideScalar(2 * MC_SCALE).addScalar(0.5);
    mc.addBall(_v.x, _v.y, _v.z, s, 12);
  }
  mc.update();
}

/* ---------- Particles that fly into the car's surface ---------- */
const N = 3200;
const pGeo = new THREE.IcosahedronGeometry(1, 2);
const particles = new THREE.InstancedMesh(pGeo, chrome, N);
particles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
particles.frustumCulled = false;
scene.add(particles);

const P = {
  target: new Float32Array(N * 3), normal: new Float32Array(N * 3), off: new Float32Array(N * 3),
  swirl: new Float32Array(N * 3), blob: new Uint8Array(N), start: new Float32Array(N), dur: new Float32Array(N),
  droplet: new Float32Array(N), spin: new Float32Array(N), size: new Float32Array(N),
};
{
  const sBody = new MeshSurfaceSampler(body).build();
  const sTire = tires.map((m) => new MeshSurfaceSampler(m).build());
  const p = new THREE.Vector3(), n = new THREE.Vector3(), nm = new THREE.Matrix3();
  for (let i = 0; i < N; i++) {
    if (i < N * 0.86) { sBody.sample(p, n); }
    else {
      const k = i % tires.length; sTire[k].sample(p, n);
      p.applyMatrix4(tires[k].matrixWorld); n.applyMatrix3(nm.getNormalMatrix(tires[k].matrixWorld)).normalize();
    }
    p.toArray(P.target, i * 3); n.toArray(P.normal, i * 3);
    // which blob does the particle live in: the one nearest on the x-axis (keeps flight paths readable)
    let best = 0, bd = 1e9;
    for (let b = 0; b < BLOBS.length; b++) { const d = Math.abs(BLOBS[b].line.x - p.x) + rnd() * 0.8; if (d < bd) { bd = d; best = b; } }
    P.blob[i] = best;
    const isDrop = rnd() < 0.24;
    P.droplet[i] = isDrop ? 0.02 + rnd() * 0.05 : 0;
    const dir = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();
    dir.multiplyScalar(isDrop ? 1.15 + rnd() * 0.9 : rnd() * 0.6);
    dir.toArray(P.off, i * 3);
    new THREE.Vector3(rnd() - 0.5, rnd() * 0.8, rnd() - 0.5).multiplyScalar(2.6).toArray(P.swirl, i * 3);
    const nx = (p.x + 2.4) / 4.8;                     // assemble rear -> front
    P.start[i] = 5.0 + nx * 2.5 + rnd() * 0.45;
    P.dur[i] = 1.0 + rnd() * 0.55;
    P.spin[i] = (rnd() - 0.5) * 1.6;
    P.size[i] = 0.032 + rnd() * 0.022;
  }
}

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3(), _d = new THREE.Vector3();
function prePos(i, t, out) {
  const bi = P.blob[i];
  blobPos(bi, t, out);
  const r = Math.max(blobRadius(bi, Math.min(t, 4.9)), 0.15);
  const ox = P.off[i * 3], oy = P.off[i * 3 + 1], oz = P.off[i * 3 + 2];
  const a = t * P.spin[i], ca = Math.cos(a), sa = Math.sin(a);
  out.x += (ox * ca - oz * sa) * r; out.y += oy * r * 0.9 + Math.sin(t * 1.3 + i) * 0.03; out.z += (ox * sa + oz * ca) * r;
  return out;
}
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

function updateParticles(t, revealX) {
  const arr = particles.instanceMatrix.array;
  for (let i = 0; i < N; i++) {
    const st = P.start[i], du = P.dur[i];
    let x, y, z, s;
    const tx = P.target[i * 3], ty = P.target[i * 3 + 1], tz = P.target[i * 3 + 2];
    if (t < st) {
      prePos(i, t, _a); x = _a.x; y = _a.y; z = _a.z;
      const launch = sstep(st - 0.5, st, t);
      s = P.droplet[i] * sstep(0.3, 1.6, t) * (1 - launch) + launch * P.size[i] * 1.5;
      if (P.droplet[i] > 0) s *= 0.9 + 0.1 * Math.sin(t * 3 + i);
    } else {
      const k = Math.min((t - st) / du, 1), e = easeIO(k);
      prePos(i, st, _a);
      _b.set(_a.x + P.swirl[i * 3], _a.y + P.swirl[i * 3 + 1], _a.z + P.swirl[i * 3 + 2]);
      _c.set(tx + P.normal[i * 3] * 1.1, ty + P.normal[i * 3 + 1] * 1.1 + 0.5, tz + P.normal[i * 3 + 2] * 1.1);
      const u = 1 - e;
      x = u * u * u * _a.x + 3 * u * u * e * _b.x + 3 * u * e * e * _c.x + e * e * e * tx;
      y = u * u * u * _a.y + 3 * u * u * e * _b.y + 3 * u * e * e * _c.y + e * e * e * ty;
      z = u * u * u * _a.z + 3 * u * u * e * _b.z + 3 * u * e * e * _c.z + e * e * e * tz;
      // stretch-free "liquid" size: bigger in flight, settle into a tight metal skin
      s = P.size[i] * (1.5 - 0.5 * e) * (1 + 0.6 * Math.sin(k * Math.PI));
      if (k >= 1) s = P.size[i] * (1 + 0.08 * Math.sin(t * 8 + i));
      s *= 1 - sstep(-0.05, 0.25, revealX - tx);  // dissolve once the solid body is revealed
    }
    const o = i * 16;
    arr[o] = s; arr[o + 1] = 0; arr[o + 2] = 0; arr[o + 3] = 0;
    arr[o + 4] = 0; arr[o + 5] = s; arr[o + 6] = 0; arr[o + 7] = 0;
    arr[o + 8] = 0; arr[o + 9] = 0; arr[o + 10] = s; arr[o + 11] = 0;
    arr[o + 12] = x; arr[o + 13] = y; arr[o + 14] = z; arr[o + 15] = 1;
  }
  particles.instanceMatrix.needsUpdate = true;
}

/* ---------- Atmosphere dust ---------- */
const DUST = 700;
const dustGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { dpos[i * 3] = (rnd() - 0.5) * 16; dpos[i * 3 + 1] = rnd() * 7; dpos[i * 3 + 2] = (rnd() - 0.5) * 16; }
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x9fe8ff, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending,
}));
scene.add(dust);

/* =====================================================================
   Post-processing
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 910), 0.55, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, dpr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  reflector.getRenderTarget().setSize(Math.round(w * dpr * 0.6), Math.round(h * dpr * 0.6));
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   Master timeline (15 s) — GSAP drives camera, FX uniforms and UI.
   Fully scrubbable: everything is a pure function of tl.time().
   ===================================================================== */
const cam = { r: 9.2, th: -0.75, h: 2.4, ty: 1.45, fov: 40 };
const fxs = { bloom: 0.55, env: 0, exposure: 0.0 };
const lights = { v: 0 };
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });

// camera — act 1: drift through the liquid
tl.fromTo(cam, { r: 8.2, th: -0.85, h: 2.6, ty: 1.55 }, { r: 9.0, th: -0.15, h: 2.0, ty: 1.45, duration: 5, ease: 'sine.inOut' }, 0);
tl.fromTo(fxs, { exposure: 0 }, { exposure: 1, duration: 1.2, ease: 'power1.out' }, 0);
// act 2: pull back into the hero 3/4 view while the car forms
tl.to(cam, { r: 12.6, th: 0.78, h: 2.5, ty: 1.35, duration: 5, ease: 'power3.inOut' }, 5);
tl.fromTo(floorU.uGrid, { value: 0 }, { value: 1, duration: 2 }, 5.2);
tl.fromTo(floorU.uShadow, { value: 0 }, { value: 1, duration: 2.5 }, 7.0);
// act 3: low, slow hero orbit + light sweep
tl.to(cam, { r: 11.6, th: 0.78 + 2.25, h: 1.15, ty: 1.55, duration: 5, ease: 'sine.inOut' }, 10);
tl.fromTo(fxs, { env: 0 }, { env: 1.4, duration: 5, ease: 'sine.inOut' }, 10);
tl.to(floorU.uGrid, { value: 0.35, duration: 2 }, 10.5);
// headlights wake up with a flicker
tl.set(lights, { v: 0 }, 0)
  .set(lights, { v: 0.8 }, 9.85).set(lights, { v: 0.05 }, 9.92).set(lights, { v: 1 }, 10.0)
  .set(lights, { v: 0.4 }, 10.06).to(lights, { v: 1, duration: 0.25, ease: 'none' }, 10.1);
tl.fromTo(floorU.uPulse, { value: 0 }, { value: 1, duration: 2.2, ease: 'power2.out' }, 10.0);
tl.fromTo(fxs, { bloom: 0.55 }, { bloom: 1.35, duration: 0.15, ease: 'power2.out' }, 9.95)
  .to(fxs, { bloom: 0.62, duration: 1.4, ease: 'power2.out' }, 10.1);
tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.55, duration: 0.1, ease: 'none' }, 9.97)
  .to('#flash', { opacity: 0, duration: 0.9, ease: 'power2.out' }, 10.07);

// UI
tl.fromTo('#topbar', { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.2);
tl.fromTo('#ph1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.6)
  .to('#ph1', { opacity: 0, y: -16, duration: 0.5, ease: 'power2.in' }, 4.6);
tl.fromTo('#ph2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 5.2)
  .to('#ph2', { opacity: 0, y: -16, duration: 0.45, ease: 'power2.in' }, 9.55);
tl.fromTo('#eyebrow', { opacity: 0, letterSpacing: '1.2em' }, { opacity: 1, letterSpacing: '0.6em', duration: 1.1, ease: 'power3.out' }, 10.15);
tl.fromTo('#hero .word > span', { yPercent: 115 }, { yPercent: 0, duration: 1.0, stagger: 0.12, ease: 'expo.out' }, 10.3);
tl.fromTo('#sub', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 10.9);
tl.fromTo('#stats .stat', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.12, ease: 'power3.out' }, 11.2);
tl.fromTo('#stats .glass', { opacity: 0, scaleX: 0.85 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: 'expo.out' }, 11.0);
tl.fromTo('#tag', { opacity: 0 }, { opacity: 1, duration: 1 }, 12.4);
const counters = { a: 0, b: 0, c: 0 };
tl.fromTo(counters, { a: 9.9, b: 0, c: 0 }, {
  a: 2.4, b: 1600, c: 420, duration: 1.6, ease: 'expo.out',
  onUpdate: () => {
    document.getElementById('s1').textContent = counters.a.toFixed(1);
    document.getElementById('s2').textContent = Math.round(counters.b).toLocaleString('de-DE');
    document.getElementById('s3').textContent = Math.round(counters.c);
  },
}, 11.25);
tl.to({}, { duration: 0.01 }, 15); // pin total length to 15 s

/* =====================================================================
   Render loop
   ===================================================================== */
const clock = new THREE.Clock();
let idle = 0;
const tcEl = document.getElementById('tc'), progEl = document.getElementById('prog');
const asmEl = document.getElementById('asm'), asmBar = document.getElementById('asmbar');
const REVEAL_T0 = 7.35, REVEAL_T1 = 10.0, REVEAL_X0 = -2.5, REVEAL_X1 = 2.5;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = tl.time();
  if (tl.progress() >= 1 && !tl.paused()) idle += dt; // keep orbiting after the cut

  // reveal sweep (rear -> front)
  const rk = Math.min(Math.max((t - REVEAL_T0) / (REVEAL_T1 - REVEAL_T0), 0), 1);
  const revealX = t < REVEAL_T0 ? -10 : rk >= 1 ? 10 : THREE.MathUtils.lerp(REVEAL_X0, REVEAL_X1, rk);
  reveal.constant = revealX;
  fx.uReveal.value = revealX;
  fx.uScan.value = t > REVEAL_T0 - 0.1 && rk < 1 ? sstep(REVEAL_T0 - 0.1, REVEAL_T0 + 0.3, t) * (1 - sstep(0.9, 1.0, rk)) : 0;
  scan.position.x = THREE.MathUtils.lerp(REVEAL_X0, REVEAL_X1, rk);
  scan.material.uniforms.uI.value = fx.uScan.value;
  scan.visible = fx.uScan.value > 0.001;
  fx.uLights.value = lights.v;

  updateMetaballs(t);
  updateParticles(t, revealX);

  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) { dp[i * 3 + 1] += dt * (0.05 + (i % 7) * 0.01); if (dp[i * 3 + 1] > 7) dp[i * 3 + 1] = 0; }
  dustGeo.attributes.position.needsUpdate = true;

  // camera
  const th = cam.th + idle * 0.12;
  camera.position.set(Math.sin(th) * cam.r, cam.h, Math.cos(th) * cam.r);
  camera.lookAt(0, cam.ty, 0);
  if (camera.fov !== cam.fov) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }

  scene.environmentRotation.y = fxs.env + idle * 0.05;
  renderer.toneMappingExposure = fxs.exposure * 1.0;
  bloom.strength = fxs.bloom;
  floorU.uTime.value = t;

  // HUD
  const shown = Math.min(t, 15);
  tcEl.textContent = '00:' + String(Math.floor(shown)).padStart(2, '0');
  progEl.style.width = (shown / 15) * 100 + '%';
  const asm = Math.round(Math.min(Math.max((t - 5) / (REVEAL_T1 - 5), 0), 1) * 100);
  asmEl.textContent = asm; asmBar.style.width = asm + '%';

  composer.render();
  requestAnimationFrame(frame);
}

/* =====================================================================
   Controls: autoplay, Space pause, R replay, wheel/touch scrub, H hide hints
   ===================================================================== */
const replayBtn = document.getElementById('replay');
tl.eventCallback('onComplete', () => { replayBtn.style.opacity = 1; replayBtn.style.pointerEvents = 'auto'; });
function replay() { idle = 0; replayBtn.style.opacity = 0; replayBtn.style.pointerEvents = 'none'; tl.restart(); }
replayBtn.addEventListener('click', replay);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); tl.paused(!tl.paused()); }
  if (e.key === 'r' || e.key === 'R') replay();
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('ui-hidden');
});
const scrub = (d) => { tl.pause(); tl.time(Math.min(Math.max(tl.time() + d, 0), 15)); };
window.addEventListener('wheel', (e) => { e.preventDefault(); scrub(e.deltaY * 0.004); }, { passive: false });
let ty0 = null;
stage.addEventListener('touchstart', (e) => { ty0 = e.touches[0].clientY; }, { passive: true });
stage.addEventListener('touchmove', (e) => { if (ty0 == null) return; const y = e.touches[0].clientY; scrub((ty0 - y) * 0.02); ty0 = y; }, { passive: true });
stage.addEventListener('touchend', () => { ty0 = null; });

// expose for recording / debugging
window.__tl = tl;

// warm up shaders once, then go
updateMetaballs(5.5); updateParticles(8, 0); renderer.compile(scene, camera);
document.getElementById('loading').remove();
setTimeout(() => gsap.to('#hint', { opacity: 0, duration: 0.8, delay: 3 }), 0);
const params = new URLSearchParams(location.search);
if (params.has('t')) { tl.time(parseFloat(params.get('t'))); } else { tl.play(0); }
requestAnimationFrame(frame);
</script>
</body>
</html>
