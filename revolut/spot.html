<body><canvas id="c" width="1080" height="1920"></canvas><script>
// 13 s vertical spec spot, rendered deterministically: render(t) draws the frame at time t.
const W=1080,H=1920,DUR=13;
const cv=document.getElementById('c'),out=cv.getContext('2d');
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
const [sc,s]=mk(),[tc,tx]=mk(),[gc,gx]=mk(),[wc,wx]=mk(W,500);
const FONT='"Inter Display","Inter",sans-serif', MONO='"JetBrains Mono",monospace';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3);
const ei=x=>Math.pow(clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TAU=Math.PI*2;

function txt(c,str,x,y,size,o={}){
  const {w=900,color='#fff',align='center',ls=0,base='alphabetic',glow=0,glowColor=null,stroke=0,fam=FONT,alpha=1}=o;
  c.save();c.globalAlpha*=alpha;c.font=`${w} ${size}px ${fam}`;c.textAlign=align;c.textBaseline=base;c.letterSpacing=ls+'px';
  if(glow){c.shadowColor=glowColor||color;c.shadowBlur=glow;}
  if(stroke){c.lineWidth=stroke;c.strokeStyle=color;c.strokeText(str,x,y);}else{c.fillStyle=color;c.fillText(str,x,y);}
  c.restore();}
function measure(c,str,size,w=900,ls=0,fam=FONT){c.save();c.font=`${w} ${size}px ${fam}`;c.letterSpacing=ls+'px';const m=c.measureText(str).width;c.restore();return m;}
function fit(c,str,maxW,size,w=900,ls=0){const m=measure(c,str,size,w,ls);return m>maxW?size*maxW/m:size;}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function reveal(c,str,x,y,size,p,o={}){ // masked slide-up text
  c.save();c.beginPath();c.rect(0,y-size*1.05,W,size*1.35);c.clip();
  txt(c,str,x,y+(1-eo(p))*size*1.2,size,o);c.restore();}
function check(c,x,y,r,p){c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=r*.18;c.strokeStyle='#fff';
  const pts=[[-.45,0],[-.12,.32],[.48,-.3]];const L1=Math.hypot(.33,.32),L2=Math.hypot(.6,.62),L=(L1+L2)*clamp(p);
  c.beginPath();c.moveTo(x+pts[0][0]*r,y+pts[0][1]*r);
  if(L<=L1){const k=L/L1;c.lineTo(x+lerp(pts[0][0],pts[1][0],k)*r,y+lerp(pts[0][1],pts[1][1],k)*r);}
  else{c.lineTo(x+pts[1][0]*r,y+pts[1][1]*r);const k=(L-L1)/L2;c.lineTo(x+lerp(pts[1][0],pts[2][0],k)*r,y+lerp(pts[1][1],pts[2][1],k)*r);}
  c.stroke();c.restore();}
function star(c,x,y,r,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*TAU/10-Math.PI/2,rad=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}c.closePath();}

// ---------- the card ----------
function card(c,cx,cy,w,ang,o={}){
  const h=w*.63,k=Math.cos(ang),front=k>=0,sx=Math.max(Math.abs(k),.015);
  c.save();c.translate(cx,cy);if(o.rot)c.rotate(o.rot);c.scale(sx,1);
  const cols=o.cols||['#161a24','#3a4152','#07080c'];
  const g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,cols[0]);g.addColorStop(.5,cols[1]);g.addColorStop(1,cols[2]);
  if(o.blur!==0){c.shadowColor=o.glow||'rgba(40,110,255,.7)';c.shadowBlur=o.blur??90;}
  rr(c,-w/2,-h/2,w,h,w*.055);c.fillStyle=g;c.fill();c.shadowBlur=0;
  c.save();rr(c,-w/2,-h/2,w,h,w*.055);c.clip();
  const sh=o.sheen??(((ang/TAU)%1+1)%1);const x0=lerp(-w*1.3,w*1.3,sh);
  const sg=c.createLinearGradient(x0-w*.35,-h,x0+w*.35,h);
  sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.5)');sg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=sg;c.fillRect(-w/2,-h/2,w,h);
  const ink=o.ink||'#fff';
  if(front){
    txt(c,'Revolut',-w/2+w*.07,-h/2+w*.13,w*.09,{w:800,align:'left',color:ink,ls:-1});
    const chg=c.createLinearGradient(0,-h*.1,0,h*.05);chg.addColorStop(0,'#f0dc9a');chg.addColorStop(1,'#a3843a');
    rr(c,-w/2+w*.07,-h*.1,w*.13,w*.1,w*.016);c.fillStyle=chg;c.fill();
    c.strokeStyle=ink;c.lineWidth=w*.009;c.lineCap='round';
    for(let i=0;i<3;i++){c.beginPath();c.arc(-w/2+w*.25,-h*.1+w*.05,w*(.022+i*.022),-.75,.75);c.stroke();}
    if(o.label)txt(c,o.label,w/2-w*.07,h/2-w*.07,w*.055,{w:800,align:'right',color:ink,ls:w*.01});
  }else{c.fillStyle='rgba(0,0,0,.65)';c.fillRect(-w/2,-h/2+h*.13,w,h*.17);}
  c.fillStyle=`rgba(0,0,0,${(1-sx)*.55})`;c.fillRect(-w/2,-h/2,w,h);
  c.restore();
  c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.3)';rr(c,-w/2,-h/2,w,h,w*.055);c.stroke();
  c.restore();}

// ---------- scene 0: wordmark slam + zoom through the "o" ----------
function intro(c,t){
  c.fillStyle='#000';c.fillRect(-300,-300,W+600,H+600);
  const word='Revolut',size=250,ls=-6;
  const total=measure(c,word,size,800,ls),x0=W/2-total/2,y=H/2+80;
  const xs=[];for(let i=0;i<word.length;i++)xs.push(x0+measure(c,word.slice(0,i),size,800,ls));
  const oc=xs[1]+measure(c,'o',size,800,ls)/2+measure(c,'Rev',size,800,ls)-measure(c,'R',size,800,ls)-measure(c,'o',size,800,ls)/2;
  const ox=x0+measure(c,'Rev',size,800,ls)+measure(c,'o',size,800,ls)/2, oy=y-size*.26;
  const z=t<.7?1+.06*seg(t,.5,.7):Math.exp(ei(seg(t,.7,1))*5.6)*1.06;
  c.save();c.translate(ox,oy);c.scale(z,z);c.translate(-ox,-oy);
  // scanning line
  const lp=seg(t,0,.12);if(t<.5){c.fillStyle=`rgba(255,255,255,${1-seg(t,.12,.4)})`;c.fillRect(W/2-W*lp/2,y-size*.3,W*lp,4);}
  const R=rnd(Math.floor(t*30)+7);
  for(let i=0;i<word.length;i++){
    const a=seg(t,.06+i*.05,.13+i*.05);if(a<=0)continue;
    const sz=size*lerp(2.4,1,eo(a));const jy=a<1?(R()-.5)*60:0;
    const lx=xs[i]+measure(c,word[i],size,800,ls)/2;
    txt(c,word[i],lx,y+jy-(sz-size)*.3,sz,{w:800,ls,alpha:a,glow:t>.5?60*(1-seg(t,.5,1))+10:0,glowColor:'#3d7bff'});
  }
  c.restore();
  // impact ring
  if(t>=.5){const k=eo(seg(t,.5,.95));c.save();c.strokeStyle=`rgba(120,170,255,${1-k})`;c.lineWidth=40*(1-k)+2;
    c.beginPath();c.arc(W/2,H/2,k*1300,0,TAU);c.stroke();c.restore();}
}

// ---------- scene 1: the card ----------
function rays(c,t,col='60,120,255',n=56){
  c.save();c.translate(W/2,H*.42);c.rotate(t*.6);
  for(let i=0;i<n;i++){c.rotate(TAU/n);c.fillStyle=`rgba(${col},${i%2?.07:.03})`;c.beginPath();c.moveTo(0,0);c.lineTo(2400,-90);c.lineTo(2400,90);c.fill();}
  c.restore();}
function speedLines(c,t,cx,cy,spd,n=140,seed=3,col='255,255,255'){
  const R=rnd(seed);c.save();c.lineCap='round';
  for(let i=0;i<n;i++){const a=R()*TAU,ph=R(),wd=1+R()*4;
    const d=((ph+t*spd*(.6+R()*.8))%1);const r0=80+Math.pow(d,2.2)*1800,len=40+d*d*spd*500;
    c.strokeStyle=`rgba(${col},${d*.7})`;c.lineWidth=wd;c.beginPath();
    c.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);c.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));c.stroke();}
  c.restore();}
function cardScene(c,t){
  const lt=t-1;
  c.fillStyle='#000';c.fillRect(-300,-300,W+600,H+600);
  const rg=c.createRadialGradient(W/2,H*.42,0,W/2,H*.42,1100);rg.addColorStop(0,'#0b3dff');rg.addColorStop(.45,'#05124d');rg.addColorStop(1,'#000');
  c.fillStyle=rg;c.fillRect(-300,-300,W+600,H+600);
  rays(c,t);speedLines(c,lt,W/2,H*.42,lt<.5?1.6:.7);
  let sc_=lerp(.04,1,eo(seg(lt,0,.5))),ang=(1-eo(seg(lt,0,.5)))*TAU*3;
  if(lt>=.5)ang=.32*Math.sin((lt-.5)*4);
  if(lt>=1)ang+=eio(seg(lt,1,1.32))*TAU;sc_*=1+.05*Math.exp(-Math.max(0,lt-1.32)*8)*(lt>1.32);
  card(c,W/2,H*.42,780*sc_,ang,{rot:-.08*(1-eo(seg(lt,0,.5)))+.03*Math.sin(lt*3),sheen:lt<.5?undefined:seg(lt,.55,1.1)*1.0+(lt>1.3?seg(lt,1.3,1.5):0)});
  if(lt>=.5&&lt<1){const p=seg(lt,.5,.62);reveal(c,'ONE CARD.',W/2,1330,150,p,{ls:-4});reveal(c,'Spend worldwide',W/2,1430,58,seg(lt,.58,.72),{w:600,color:'rgba(255,255,255,.85)'});}
  if(lt>=1){const p=seg(lt,1.02,1.14);reveal(c,'EVERY',W/2,1290,150,p,{ls:-4});reveal(c,'CURRENCY.',W/2,1440,150,seg(lt,1.08,1.2),{ls:-4,color:'#7fb0ff'});}
}

const CUTS=[[.5,1],[1,.9],[1.5,.6],[2,.5]];for(let k=0;k<12;k++)CUTS.push([2.5+k*.5,.8]);

const BEATS=[];for(let b=.5;b<8.5;b+=.5)BEATS.push(b);for(let b=8.5;b<10.5;b+=.25)BEATS.push(b);for(let b=10.5;b<13;b+=.5)BEATS.push(b);

  const fo=seg(t,12.75,13);if(fo>0){out.fillStyle=`rgba(0,0,0,${fo})`;out.fillRect(0,0,W,H);}
}
