    const due = c.due ? new Date(c.due + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
    const del = confirmDel === c.id
      ? `<div class="confirm">Karte löschen? <button type="button" class="yes" data-a="del-yes" data-id="${c.id}">Löschen</button><button type="button" data-a="del-no">Abbrechen</button></div>` : "";
    return `<article class="card${c.col === "done" ? " done" : ""}" draggable="${readOnly ? "false" : "true"}" data-id="${c.id}">
      <div class="c-top"><div class="c-title">${esc(c.title)}</div>
        <div class="c-act">
          <button type="button" data-a="left" data-id="${c.id}" aria-label="Nach links verschieben" title="Nach links" ${ci === 0 || readOnly ? "disabled" : ""}>&#8592;</button>
          <button type="button" data-a="right" data-id="${c.id}" aria-label="Nach rechts verschieben" title="Nach rechts" ${ci === COLS.length - 1 || readOnly ? "disabled" : ""}>&#8594;</button>
          <button type="button" data-a="edit" data-id="${c.id}" aria-label="Bearbeiten" title="Bearbeiten" ${readOnly ? "disabled" : ""}>&#9998;</button>
          <button type="button" data-a="del" data-id="${c.id}" aria-label="Löschen" title="Löschen" ${readOnly ? "disabled" : ""}>&#215;</button>
        </div></div>
      ${c.note ? `<div class="c-note">${esc(c.note)}</div>` : ""}
      <div class="c-meta"><span class="tag ${esc(c.tag)}">${esc(TAGS[c.tag] || c.tag)}</span>${c.sp ? `<span class="sp">${esc(c.sp)} SP</span>` : ""}<span class="who${c.owner ? " set" : ""}">${c.owner ? esc(c.owner) : "offen"}</span>${due ? `<span class="due">fällig ${due}</span>` : ""}</div>
      ${del}
    </article>`;
  }
  function formHtml(c, col) {
    const isNew = !c;
    c = c || { id: "", title: "", tag: col === "backlog" ? "linea" : "start", owner: "", note: "", due: "", sp: "" };
    const opt = (o, v, label) => `<option value="${esc(o)}"${o === v ? " selected" : ""}>${esc(label || o || "offen")}</option>`;
    const pre = isNew ? "new-" + col : "e-" + c.id;
    return `<form class="edit" data-form="${isNew ? "new" : "edit"}" data-id="${esc(c.id)}" data-col="${esc(col)}">
      <label for="${pre}-title">Aufgabe<input id="${pre}-title" name="title" value="${esc(c.title)}" maxlength="120" placeholder="z. B. Folien gegenlesen"></label>
      <div class="row2">
        <label for="${pre}-tag">Bereich<select id="${pre}-tag" name="tag">${Object.keys(TAGS).map(k => opt(k, c.tag, TAGS[k])).join("")}</select></label>
        <label for="${pre}-owner">Zuständig<select id="${pre}-owner" name="owner">${OWNERS.map(o => opt(o, c.owner)).join("")}</select></label>
      </div>
      <div class="row2">
        <label for="${pre}-due">Fällig am<input id="${pre}-due" name="due" type="date" value="${esc(c.due)}"></label>
        <label for="${pre}-sp">Story Points<input id="${pre}-sp" name="sp" inputmode="numeric" value="${esc(c.sp)}" maxlength="3" placeholder="–"></label>
      </div>
      <label for="${pre}-note">Notiz<textarea id="${pre}-note" name="note" maxlength="300">${esc(c.note)}</textarea></label>
      <p class="err" hidden>Bitte eine Aufgabe eintragen.</p>
      <div class="f-act"><button type="button" data-a="cancel">Abbrechen</button><button type="submit" class="primary">${isNew ? "Hinzufügen" : "Speichern"}</button></div>
    </form>`;
  }
  function render() {
    const shown = (c) => filter === "all" || c.tag === filter;
    const work = S.cards.filter(c => c.col !== "backlog");
    const done = work.filter(c => c.col === "done").length;
    const pct = work.length ? Math.round(done / work.length * 100) : 0;
    const doing = S.cards.filter(c => c.col === "doing").length;
    const sp = S.cards.filter(c => c.col === "backlog").reduce((a, c) => a + (parseInt(c.sp, 10) || 0), 0);
    const [scls, stxt] = STATUS[status] || STATUS.local;
    const focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = `<div class="wrap${compact ? " compact" : ""}">
      <header class="top">
        <div><h1>Lumyx <span>Projekt-Kanban</span></h1>
        <div class="sub">Projekt Lumyx · KI-Telefonassistent für Arztpraxen · Team Mika &amp; Tim · Stand ${esc(S.updated || "–")}</div></div>
        <div class="tools"><span class="status ${scls}" role="status">${stxt}</span>
${status === "snapshot" ? `<div class="banner" style="background:var(--soft);border-color:var(--accent)">Öffentliche Ansicht unseres Projekt-Boards Lumyx (Stand ${esc(S.updated || "–")}). Bearbeitet wird es von Mika und Tim.</div>` : ""}
          <button type="button" class="tbtn" id="kb-compact" aria-pressed="${compact}">Kompakt</button></div>
      </header>
      ${status === "readonly" ? `<div class="banner">Du kannst das Board ansehen, aber nicht speichern. Bitte den Besitzer, dir im Teilen-Menü Bearbeitungsrechte zu geben.</div>` : ""}
      ${status === "error" ? `<div class="banner">Die letzte Änderung wurde nicht gespeichert. Prüfe die Verbindung und verschiebe die Karte noch einmal.</div>` : ""}
      <div class="summary">
        <div class="prog"><span class="kv">Fortschritt <b>${done}/${work.length}</b> Aufgaben</span><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><b>${pct} %</b></div>
        <span class="kv">In Arbeit <b>${doing}/3</b></span>
        <span class="kv">Backlog <b>${sp} SP</b></span>
        <div class="filters" role="group" aria-label="Nach Bereich filtern">
          <button type="button" data-f="all" aria-pressed="${filter === "all"}">Alle</button>
          ${Object.keys(TAGS).map(k => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${TAGS[k]}</button>`).join("")}
        </div>
      </div>
      <div class="board">
        ${COLS.map(col => {
          const cards = S.cards.filter(c => c.col === col.id);
          const vis = cards.filter(shown);
          const over = col.limit && cards.length > col.limit;
          return `<section class="col" data-col="${col.id}" aria-label="${col.name}">
            <div class="col-h"><h2>${col.name}<small>${col.hint}</small></h2><span class="count${col.limit && cards.length >= col.limit ? " limit" : ""}">${col.limit ? cards.length + "/" + col.limit : cards.length}</span></div>
            ${over ? `<div class="err">WIP-Limit überschritten: erst etwas abschließen.</div>` : ""}
            <div class="list" data-col="${col.id}">${vis.map(cardHtml).join("")}</div>
            ${readOnly ? "" : adding === col.id ? formHtml(null, col.id) : `<button type="button" class="add" data-a="add" data-col="${col.id}">+ Karte hinzufügen</button>`}
          </section>`;
        }).join("")}
      </div>
      <p class="note">Karten mit der Maus ziehen oder mit den Pfeilen verschieben. Jede Änderung wird für alle gespeichert, die das Board öffnen. „Erledigt“ zeigt die abgeschlossene Analyse-, Definitions- und Planungsphase, „To Do“ die nächsten Schritte laut Meilensteinplan (M1–M2), „Backlog“ die 9 User Stories für die Sprints in M3–M4.</p>
    </div>`;
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
    const firstInput = app.querySelector("form.edit input[name=title]");
    if (firstInput && !focusId) firstInput.focus();
  }

  /* ---------- Ereignisse ---------- */
  app.addEventListener("click", (e) => {
    const f = e.target.closest("[data-f]");
    if (f) { filter = f.dataset.f; render(); return; }
    if (e.target.closest("#kb-compact")) { compact = !compact; try { localStorage.setItem("kb-compact", compact ? "1" : "0"); } catch (err) {} render(); return; }
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a, id = b.dataset.id;
    if (a === "left") move(id, -1);
    else if (a === "right") move(id, 1);
    else if (a === "edit") { editing = id; adding = null; confirmDel = null; render(); }
    else if (a === "del") { confirmDel = id; render(); }
    else if (a === "del-no") { confirmDel = null; render(); }
    else if (a === "del-yes") { S.cards = S.cards.filter(c => c.id !== id); confirmDel = null; commit(); }
    else if (a === "add") { adding = b.dataset.col; editing = null; render(); }
    else if (a === "cancel") { adding = null; editing = null; render(); }
  });
  app.addEventListener("submit", (e) => {
    const form = e.target.closest("form.edit"); if (!form) return;
    e.preventDefault();
    const fd = new FormData(form);
    const title = String(fd.get("title") || "").trim();
    if (!title) { form.querySelector(".err").hidden = false; return; }
    const data = { title, tag: String(fd.get("tag") || "referat"), owner: String(fd.get("owner") || ""), due: String(fd.get("due") || ""), note: String(fd.get("note") || "").trim(), sp: String(fd.get("sp") || "").replace(/[^0-9]/g, "") };
    if (form.dataset.form === "new") { S.cards.push(Object.assign({ id: newId(), col: form.dataset.col }, data)); adding = null; }
    else { const c = byId(form.dataset.id); if (c) Object.assign(c, data); editing = null; }
    commit();
  });
  app.addEventListener("keydown", (e) => { if (e.key === "Escape" && (editing || adding || confirmDel)) { editing = adding = confirmDel = null; render(); } });

  let dragId = null;
  app.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card"); if (!card || readOnly) return;
    dragId = card.dataset.id; card.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
  });
  app.addEventListener("dragend", () => { dragId = null; app.querySelectorAll(".dragging, .over").forEach(el => el.classList.remove("dragging", "over")); });
  app.addEventListener("dragover", (e) => {
    const col = e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    app.querySelectorAll(".col.over").forEach(el => { if (el !== col) el.classList.remove("over"); });
    col.classList.add("over");
  });
  app.addEventListener("drop", (e) => {
    const col = e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    const cards = Array.from(col.querySelectorAll(".card")).filter(el => el.dataset.id !== dragId);
    const before = cards.find(el => { const r = el.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    const id = dragId; dragId = null;
    dropTo(id, col.dataset.col, before ? before.dataset.id : null);
  });

  render();
})();
</script>

</body></html>
