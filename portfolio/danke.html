<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danke · FLUXE Studio</title>
<meta name="description" content="Deine Nachricht ist angekommen.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d4ff3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="danke">
<main>

  <section class="phero center" style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
    <p class="kicker reveal">Angekommen</p>
    <h1 class="reveal" id="dh">Danke!<br>Ich melde mich.</h1>
    <p class="lead reveal" id="dt">Deine Nachricht ist bei mir eingegangen. Du hörst innerhalb von <span data-cfg="responseTime">24 Stunden</span> von mir – meistens schneller.</p>
    <div class="hero-cta reveal"><a class="btn" href="arbeiten.html">Arbeiten ansehen</a><a class="btn btn-ghost" href="index.html">Zur Startseite</a></div>
  </section>
</main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
(() => { const t = new URLSearchParams(location.search).get('typ');
  if (t === 'check') { document.getElementById('dh').innerHTML = 'Check ist<br>unterwegs.'; document.getElementById('dt').textContent = 'Ich schaue mir deinen Auftritt an und schicke dir innerhalb von 48 Stunden dein Video mit drei konkreten Verbesserungen.'; }
  if (t === 'bewerbung') { document.getElementById('dh').innerHTML = 'Danke für<br>deine Bewerbung.'; document.getElementById('dt').textContent = 'Ich lese mir alles in Ruhe durch und melde mich innerhalb einer Woche bei dir.'; }
})();
</script>
</body>
</html>
